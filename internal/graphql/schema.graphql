scalar Time
scalar UUID

type User {
  id: UUID!
  email: String!
  displayName: String!
  timezone: String!
  createdAt: Time!
}

type AuthPayload {
  user: User!
  accessToken: String!
  refreshToken: String!
}

enum WorkoutStatus {
  IN_PROGRESS
  COMPLETED
}

type Exercise {
  id: UUID!
  name: String!
  category: String!
  muscleGroups: [String!]!
  equipment: String!
  isCustom: Boolean!
  instructions: String!
}

enum SetType {
  NORMAL
  WARMUP
  DROPSET
  FAILURE
}

type WorkoutSet {
  id: UUID!
  exerciseId: UUID!
  setNumber: Int!
  reps: Int!
  weightKg: Float!
  rpe: Float
  setType: SetType!
  supersetId: UUID
  performedAt: Time!
}

type Workout {
  id: UUID!
  startedAt: Time!
  endedAt: Time
  notes: String!
  status: WorkoutStatus!
  sets: [WorkoutSet!]!
  templateId: UUID
}

type TemplateExercise {
  id: UUID!
  exerciseId: UUID!
  position: Int!
  targetSets: Int!
  targetReps: Int
  supersetGroup: Int
}

type WorkoutTemplate {
  id: UUID!
  name: String!
  createdAt: Time!
  exercises: [TemplateExercise!]!
}

input ExerciseInput {
  name: String!
  category: String!
  muscleGroups: [String!]!
  equipment: String!
}

input TemplateExerciseInput {
  exerciseId: UUID!
  targetSets: Int!
  targetReps: Int
  supersetGroup: Int
}

type PersonalRecord {
  id: UUID!
  exerciseId: UUID!
  recordType: String!
  value: Float!
  achievedAt: Time!
  workoutSetId: UUID!
}

type LogSetResult {
  set: WorkoutSet!
  newRecords: [PersonalRecord!]!
}

type WorkoutEdge {
  cursor: String!
  node: Workout!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type WorkoutConnection {
  edges: [WorkoutEdge!]!
  pageInfo: PageInfo!
}

type ProgressPoint {
  day: Time!
  totalVolume: Float!
  maxWeight: Float!
  maxReps: Int!
  setCount: Int!
}

type BodyMetric {
  id: UUID!
  metricType: String!
  value: Float!
  recordedAt: Time!
}

type ProgressionSuggestion {
  suggestedWeightKg: Float!
  suggestedReps: Int!
  reasoning: String!
  basedOnRpe: Float
}

type PlateauStatus {
  isPlateaued: Boolean!
  currentBestKg: Float!
  message: String!
}

enum FitnessGoal {
  STRENGTH
  HYPERTROPHY
  FAT_LOSS
  GENERAL_FITNESS
}

enum ExperienceLevel {
  BEGINNER
  INTERMEDIATE
  ADVANCED
}

type UserFitnessProfile {
  goal: FitnessGoal!
  experienceLevel: ExperienceLevel!
  daysPerWeek: Int!
  equipmentAccess: [String!]!
  avoidMuscleGroups: [String!]!
  updatedAt: Time!
}

input FitnessProfileInput {
  goal: FitnessGoal!
  experienceLevel: ExperienceLevel!
  daysPerWeek: Int!
  equipmentAccess: [String!]!
  avoidMuscleGroups: [String!]!
}

type ProgramDay {
  id: UUID!
  dayLabel: String!
  position: Int!
  template: WorkoutTemplate!
}

enum ProgressionRule {
  LINEAR
  DOUBLE_PROGRESSION
  NONE
}

type Program {
  id: UUID!
  name: String!
  goal: FitnessGoal!
  daysPerWeek: Int!
  notes: String!
  createdAt: Time!
  days: [ProgramDay!]!
  isActive: Boolean!
  progressionRule: ProgressionRule!
}

type NextWorkout {
  program: Program!
  day: ProgramDay!
  weekNumber: Int!
}

type ExerciseTarget {
  exerciseId: UUID!
  targetSets: Int!
  targetReps: Int
  suggestedWeightKg: Float!
  weekNumber: Int!
  reasoning: String!
}

input ProgramDayInput {
  dayLabel: String!
  templateId: UUID!
}

input CreateProgramInput {
  name: String!
  days: [ProgramDayInput!]!
}

type Query {
  me: User
  exercises(search: String): [Exercise!]!
  activeWorkout: Workout
  workoutHistory(first: Int!, after: String): WorkoutConnection!
  personalRecords: [PersonalRecord!]!
  lastSetForExercise(exerciseId: UUID!): WorkoutSet
  workoutTemplates: [WorkoutTemplate!]!

  progressOverTime(exerciseId: UUID!, days: Int!): [ProgressPoint!]!
  volumeTrend(days: Int!): [ProgressPoint!]!
  bodyMetrics(metricType: String!, days: Int!): [BodyMetric!]!

  progressionSuggestion(exerciseId: UUID!): ProgressionSuggestion
  plateauStatus(exerciseId: UUID!): PlateauStatus!

  myFitnessProfile: UserFitnessProfile
  myPrograms: [Program!]!
  nextWorkout: NextWorkout
  programDayTargets(programDayId: UUID!): [ExerciseTarget!]!

  # The caller's virtual companion, or null if they haven't created one yet
  # (the client shows onboarding in that case). tzOffsetMinutes is the
  # viewer's UTC offset in minutes (east-positive) so streak day-boundaries
  # land on the user's local midnight; defaults to UTC.
  pet(tzOffsetMinutes: Int): Pet
}

type Mutation {
  signup(email: String!, password: String!, displayName: String!): AuthPayload!
  login(email: String!, password: String!): AuthPayload!
  refreshToken(refreshToken: String!): AuthPayload!
  logout(refreshToken: String!): Boolean!

  startWorkout(templateId: UUID): Workout!
  logSet(workoutId: UUID!, exerciseId: UUID!, reps: Int!, weightKg: Float!, rpe: Float, setType: SetType, supersetId: UUID): LogSetResult!
  updateSet(setId: UUID!, reps: Int!, weightKg: Float!, rpe: Float, setType: SetType): WorkoutSet!
  deleteSet(setId: UUID!): Boolean!
  finishWorkout(workoutId: UUID!, notes: String): Workout!
  deleteWorkout(workoutId: UUID!): Boolean!

  createWorkoutTemplate(name: String!, exercises: [TemplateExerciseInput!]!): WorkoutTemplate!
  updateWorkoutTemplate(templateId: UUID!, name: String!, exercises: [TemplateExerciseInput!]!): WorkoutTemplate!
  deleteWorkoutTemplate(templateId: UUID!): Boolean!

  createExercise(input: ExerciseInput!): Exercise!
  updateExercise(exerciseId: UUID!, input: ExerciseInput!): Exercise!
  deleteExercise(exerciseId: UUID!): Boolean!

  logBodyMetric(metricType: String!, value: Float!): BodyMetric!

  saveFitnessProfile(input: FitnessProfileInput!): UserFitnessProfile!
  generateProgram: Program!
  createProgramFromTemplates(input: CreateProgramInput!): Program!
  setActiveProgram(programId: UUID!): Program!

  createPet(name: String!, species: PetSpecies!, color: PetColor!): Pet!
  renamePet(name: String!): Pet!
  setPetColor(color: PetColor!): Pet!
  equipAccessory(accessoryId: UUID!): Pet!
  unequipAccessory(accessoryId: UUID!): Pet!
}

type Subscription {
  # Streams every set logged (and any PRs it broke) to anyone watching this
  # workout, backed by Redis pub/sub so it fans out across API instances.
  workoutProgressUpdated(workoutId: UUID!): LogSetResult!
}

# --- Virtual companion pet ---------------------------------------------------

enum PetSpecies { SPROUT EMBER PEBBLE DRIFT }
enum PetColor { GREEN RED BLUE AMBER VIOLET }
enum PetStage { EGG HATCHLING JUVENILE ADULT CHAMPION }
enum MoodState { HAPPY CONTENT LOW NEGLECTED }

# Asset keys, not baked images: v1 ships placeholder art, real art is a later
# content drop that reuses the same keys with no schema or code change.
type PetAppearance {
  bodyAssetKey: String!
  expressionAssetKey: String!
  tint: String!
  layers: [String!]!
}

type Accessory {
  id: UUID!
  code: String!
  name: String!
  slot: String!
  unlockHint: String!
}

type PetAccessory {
  accessory: Accessory!
  unlockedAt: Time!
  equipped: Boolean!
}

type Pet {
  id: UUID!
  name: String!
  species: PetSpecies!
  color: PetColor!
  stage: PetStage!
  stageLabel: String!
  # Short-term 0..100 mood, derived on read from recent finished workouts.
  mood: Int!
  moodState: MoodState!
  currentStreak: Int!
  longestStreak: Int!
  # Cumulative finished workouts still needed to reach the next stage; null at
  # the final stage.
  workoutsToNextStage: Int
  hatchedAt: Time
  appearance: PetAppearance!
  accessories: [PetAccessory!]!
  # Accessories unlocked on THIS read, for a one-time celebration.
  newlyUnlocked: [PetAccessory!]!
}
