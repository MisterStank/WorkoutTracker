scalar Time
scalar UUID

type User {
  id: UUID!
  email: String!
  displayName: String!
  timezone: String!
  createdAt: Time!
}

type AuthPayload {
  user: User!
  accessToken: String!
  refreshToken: String!
}

enum WorkoutStatus {
  IN_PROGRESS
  COMPLETED
}

type Exercise {
  id: UUID!
  name: String!
  category: String!
  muscleGroups: [String!]!
  equipment: String!
  isCustom: Boolean!
}

enum SetType {
  NORMAL
  WARMUP
  DROPSET
  FAILURE
}

type WorkoutSet {
  id: UUID!
  exerciseId: UUID!
  setNumber: Int!
  reps: Int!
  weightKg: Float!
  rpe: Float
  setType: SetType!
  supersetId: UUID
  performedAt: Time!
}

type Workout {
  id: UUID!
  startedAt: Time!
  endedAt: Time
  notes: String!
  status: WorkoutStatus!
  sets: [WorkoutSet!]!
  templateId: UUID
}

type TemplateExercise {
  id: UUID!
  exerciseId: UUID!
  position: Int!
  targetSets: Int!
  targetReps: Int
  supersetGroup: Int
}

type WorkoutTemplate {
  id: UUID!
  name: String!
  createdAt: Time!
  exercises: [TemplateExercise!]!
}

input TemplateExerciseInput {
  exerciseId: UUID!
  targetSets: Int!
  targetReps: Int
  supersetGroup: Int
}

type PersonalRecord {
  id: UUID!
  exerciseId: UUID!
  recordType: String!
  value: Float!
  achievedAt: Time!
  workoutSetId: UUID!
}

type LogSetResult {
  set: WorkoutSet!
  newRecords: [PersonalRecord!]!
}

type WorkoutEdge {
  cursor: String!
  node: Workout!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type WorkoutConnection {
  edges: [WorkoutEdge!]!
  pageInfo: PageInfo!
}

type ProgressPoint {
  day: Time!
  totalVolume: Float!
  maxWeight: Float!
  setCount: Int!
}

type BodyMetric {
  id: UUID!
  metricType: String!
  value: Float!
  recordedAt: Time!
}

type Query {
  me: User
  exercises(search: String): [Exercise!]!
  activeWorkout: Workout
  workoutHistory(first: Int!, after: String): WorkoutConnection!
  personalRecords: [PersonalRecord!]!
  lastSetForExercise(exerciseId: UUID!): WorkoutSet
  workoutTemplates: [WorkoutTemplate!]!

  progressOverTime(exerciseId: UUID!, days: Int!): [ProgressPoint!]!
  volumeTrend(days: Int!): [ProgressPoint!]!
  bodyMetrics(metricType: String!, days: Int!): [BodyMetric!]!
}

type Mutation {
  signup(email: String!, password: String!, displayName: String!): AuthPayload!
  login(email: String!, password: String!): AuthPayload!
  refreshToken(refreshToken: String!): AuthPayload!
  logout(refreshToken: String!): Boolean!

  startWorkout(templateId: UUID): Workout!
  logSet(workoutId: UUID!, exerciseId: UUID!, reps: Int!, weightKg: Float!, rpe: Float, setType: SetType, supersetId: UUID): LogSetResult!
  finishWorkout(workoutId: UUID!, notes: String): Workout!

  createWorkoutTemplate(name: String!, exercises: [TemplateExerciseInput!]!): WorkoutTemplate!
  deleteWorkoutTemplate(templateId: UUID!): Boolean!

  logBodyMetric(metricType: String!, value: Float!): BodyMetric!
}

type Subscription {
  # Streams every set logged (and any PRs it broke) to anyone watching this
  # workout, backed by Redis pub/sub so it fans out across API instances.
  workoutProgressUpdated(workoutId: UUID!): LogSetResult!
}
