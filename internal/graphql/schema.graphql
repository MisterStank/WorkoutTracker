scalar Time
scalar UUID

type User {
  id: UUID!
  email: String!
  displayName: String!
  timezone: String!
  createdAt: Time!
}

type AuthPayload {
  user: User!
  accessToken: String!
  refreshToken: String!
}

enum WorkoutStatus {
  IN_PROGRESS
  COMPLETED
}

type Exercise {
  id: UUID!
  name: String!
  category: String!
  muscleGroups: [String!]!
  equipment: String!
  isCustom: Boolean!
}

type WorkoutSet {
  id: UUID!
  exerciseId: UUID!
  setNumber: Int!
  reps: Int!
  weightKg: Float!
  rpe: Float
  performedAt: Time!
}

type Workout {
  id: UUID!
  startedAt: Time!
  endedAt: Time
  notes: String!
  status: WorkoutStatus!
  sets: [WorkoutSet!]!
}

type PersonalRecord {
  id: UUID!
  exerciseId: UUID!
  recordType: String!
  value: Float!
  achievedAt: Time!
  workoutSetId: UUID!
}

type LogSetResult {
  set: WorkoutSet!
  newRecords: [PersonalRecord!]!
}

type WorkoutEdge {
  cursor: String!
  node: Workout!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type WorkoutConnection {
  edges: [WorkoutEdge!]!
  pageInfo: PageInfo!
}

type ProgressPoint {
  day: Time!
  totalVolume: Float!
  maxWeight: Float!
  setCount: Int!
}

type BodyMetric {
  id: UUID!
  metricType: String!
  value: Float!
  recordedAt: Time!
}

type Query {
  me: User
  exercises(search: String): [Exercise!]!
  activeWorkout: Workout
  workoutHistory(first: Int!, after: String): WorkoutConnection!
  personalRecords: [PersonalRecord!]!

  progressOverTime(exerciseId: UUID!, days: Int!): [ProgressPoint!]!
  volumeTrend(days: Int!): [ProgressPoint!]!
  bodyMetrics(metricType: String!, days: Int!): [BodyMetric!]!
}

type Mutation {
  signup(email: String!, password: String!, displayName: String!): AuthPayload!
  login(email: String!, password: String!): AuthPayload!
  refreshToken(refreshToken: String!): AuthPayload!
  logout(refreshToken: String!): Boolean!

  startWorkout: Workout!
  logSet(workoutId: UUID!, exerciseId: UUID!, reps: Int!, weightKg: Float!, rpe: Float): LogSetResult!
  finishWorkout(workoutId: UUID!, notes: String): Workout!

  logBodyMetric(metricType: String!, value: Float!): BodyMetric!
}

type Subscription {
  # Streams every set logged (and any PRs it broke) to anyone watching this
  # workout, backed by Redis pub/sub so it fans out across API instances.
  workoutProgressUpdated(workoutId: UUID!): LogSetResult!
}
