name: api

on:
  # pull_request is deliberately NOT path-filtered: this workflow is a
  # required status check (branch protection on main), and a required check
  # that a path filter prevents from ever running on some PRs blocks merging
  # that PR forever, waiting on a check that will never report. push stays
  # path-filtered since nothing there gates a merge.
  pull_request:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/api.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # golangci-lint refuses to run if it was built with an older Go
          # than go.mod targets — and upstream's latest published binary
          # release (checked at the time this was written) still trails
          # our go1.25 go.mod. Building from source with goinstall uses
          # this job's own (current) Go toolchain instead of a prebuilt
          # binary, sidestepping the mismatch entirely.
          install-mode: goinstall

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Everything that doesn't need a database. The repository and graphql
      # packages are covered by integration-test below (they need Postgres);
      # excluding them here keeps this job infra-free and fast. dbtest has no
      # tests of its own.
      - run: |
          go test -race $(go list ./... | grep -vE '/internal/(repository|graphql|dbtest)$')

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gymon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: run migrations
        run: |
          # The plain `go install .../cmd/migrate` build excludes every
          # database driver by default (keeps the binary small) — without
          # this build tag it compiles but errors at runtime with "unknown
          # driver postgres" the moment it tries to connect.
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -database "postgres://postgres:postgres@localhost:5432/gymon?sslmode=disable" -path migrations up
      # DATABASE_URL is set, so the dbtest harness reuses this service
      # container instead of booting an embedded Postgres.
      - run: go test -race ./internal/repository/... ./internal/graphql/...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/gymon?sslmode=disable

  # No deploy job here on purpose: Render builds and deploys straight from
  # this repo's Dockerfile on every push to main once the web service's
  # auto-deploy is enabled in its dashboard, so lint/unit-test/integration-test
  # passing is the only thing this workflow needs to gate.
