name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: # manual re-deploy (e.g. after changing the API_URL variable)

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - run: flutter pub get

      # Generates the Drift code (app_database.g.dart etc.) — not committed,
      # so the build fails without this. Mirrors .github/workflows/mobile.yml.
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web bundle
        run: flutter build web --release --base-href / --dart-define=API_URL=${{ vars.API_URL }}

      # Run wrangler directly rather than cloudflare/wrangler-action@v3: that
      # action still defaults to wrangler v3, which can't deploy a static-
      # assets-only Worker (no `main`) and fails with "Missing entry-point".
      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4 deploy # reads mobile/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
